# Codecov settings. https://docs.codecov.com/docs/codecovyml-reference
#
# The local minimum is `fail_under` in pyproject.toml. It stops a run that goes
# below the agreed value. Codecov adds the report for each pull request: it shows
# the lines that the new code does not test.

coverage:
  precision: 1
  round: down
  range: "85...100"

  status:
    project:
      default:
        # The coverage of the full repository must not decrease by more than 1%.
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        # New lines and changed lines need tests.
        target: 90%
        threshold: 0%

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true      # Write a comment only if the coverage changes.

ignore:
  - "tests/**"
