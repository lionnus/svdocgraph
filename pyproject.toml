[project]
name = "svdocgraph"
version = "0.1.0"
description = "Bender-aware SystemVerilog design map & documentation generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Lionnus Kesting" }]
keywords = ["systemverilog", "bender", "documentation", "hardware", "rtl", "slang"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  # SystemVerilog parsing + elaboration (MIT). `Driver` moved to `pyslang.driver`
  # in 11.0; on 8-10 the extractor finds no driver and yields an empty design, so
  # the floor is a hard requirement rather than a preference. Capped because the
  # elaborated-AST API is not stable across majors.
  "pyslang>=11,<12",
  "Jinja2>=3.0,<4",   # HTML templating
  "PyYAML>=5.4,<7",   # Bender.yml / Bender.lock parsing
  "markdown-it-py>=3,<5",   # The README and the doc/ pages of the repository
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/lionnus/svdocgraph"
Issues = "https://github.com/lionnus/svdocgraph/issues"

[project.scripts]
svdocgraph = "svdocgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svdocgraph"]
# Templates, CSS/JS and fonts live inside the package and must ship in the wheel.
artifacts = [
  "svdocgraph/templates/**",
  "svdocgraph/assets/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Tests import helpers from conftest.py by name.
pythonpath = ["tests"]

[tool.coverage.run]
source = ["svdocgraph"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
# The minimum that CI enforces. It is also the number on the README badge.
# Increase it when the tests increase. Do not decrease it to pass a failed job.
fail_under = 95
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "except ImportError:",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
